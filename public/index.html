<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; }
    #chat { flex: 1; width: 100%; max-width: 600px; overflow-y: auto; padding: 10px; border-bottom: 1px solid #ccc; }
    .message { margin: 5px 0; }
    .user { text-align: right; }
    .bot { text-align: left; }
    #input-form { display: flex; width: 100%; max-width: 600px; }
    #input { flex: 1; padding: 10px; font-size: 16px; }
    #send { padding: 10px; font-size: 16px; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <form id="input-form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('input-form');
    const input = document.getElementById('input');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('user', message);
      input.value = '';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        addMessage('bot', data.reply);
      } catch (err) {
        addMessage('bot', 'Error: Unable to reach server.');
      }
    });

    function addMessage(role, text) {
      const msgEl = document.createElement('div');
      msgEl.classList.add('message', role);
      msgEl.textContent = text;
      chat.appendChild(msgEl);
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
