<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ollama Chat App</title>
  <style>
    :root {
      --background: #ffffff;
      --card-background: #ffffff;
      --text-primary: #000000;
      --text-secondary: #8e8e93;
      --border-color: rgba(0, 0, 0, 0.1);
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      --blue: #007AFF;
      --bubble-gray: #E5E5EA;
      --bubble-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --input-gray: #F2F2F7;
      --input-shadow: 0 0 0 1px rgba(0, 0, 0, 0.06);
      --send-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      background-color: var(--background);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #chat {
      flex: 1;
      width: 100%;
      max-width: 600px;
      overflow-y: auto;
      padding: 15px;
      background-color: var(--card-background);
      border-radius: 20px;
      box-shadow: var(--shadow);
      margin-bottom: 15px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .message {
      margin: 8px 0;
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 15px 15px 15px 0;
      font-size: 16px;
      line-height: 1.4;
      box-shadow: var(--bubble-shadow);
      transition: transform 0.2s ease;
    }

    .think-content {
      background-color: #f4f5f7;
      border-radius: 4px;
      margin: 8px 0;
      padding: 12px;
      font-size: 0.9em;
      line-height: 1.5;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
      transition: all 0.2s ease-in-out;
    }

    .think-header {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      padding: 8px 0;
      margin-bottom: 8px;
      border-bottom: 1px solid #e1e1e1;
    }

    .think-header:hover {
      background-color: #e8e9eb;
    }

    .think-toggle-icon {
      width: 12px;
      height: 12px;
      transition: transform 0.2s ease-in-out;
    }

    .think-toggle-icon.expanded {
      transform: rotate(90deg);
    }

    .think-toggle-text {
      color: #4e5d6c;
      font-size: 0.9em;
      font-weight: 500;
    }

    .think-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-in-out;
      padding: 0 0 8px 0;
    }

    .think-body.expanded {
      max-height: 500px;
    }

    .message:hover {
      transform: scale(1.02);
    }

    .message.user {
      margin-left: 15%;
      background-color: var(--blue);
      color: white;
      border-radius: 15px 15px 0 15px;
    }

    .message.bot {
      margin-right: 15%;
      background-color: var(--bubble-gray);
      color: var(--text-primary);
    }

    #input-form {
      display: flex;
      width: 100%;
      max-width: 600px;
      padding: 10px 15px;
      background-color: var(--card-background);
      border-radius: 20px;
      box-shadow: var(--shadow);
      position: relative;
      gap: 8px;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: none;
      border-radius: 20px;
      background-color: var(--input-gray);
      color: var(--text-primary);
      transition: all 0.2s ease;
      margin-right: 8px;
      -webkit-appearance: none;
      box-shadow: var(--input-shadow);
    }

    #input:focus {
      outline: none;
      background-color: white;
      box-shadow: 0 0 0 2px rgba(0, 122, 255, 0.2);
    }

    #send {
      padding: 12px 24px;
      font-size: 16px;
      font-weight: 500;
      border: none;
      border-radius: 20px;
      background-color: var(--blue);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      -webkit-appearance: none;
      box-shadow: var(--send-shadow);
    }

    #send:hover {
      background-color: #006AFF;
      transform: scale(1.02);
    }

    #send:active {
      transform: scale(0.98);
    }

    #send::before {
      content: "→";
      font-size: 18px;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      #input-form {
        padding: 8px 12px;
      }

      #chat {
        margin: 15px 12px;
      }

      .message {
        margin: 6px 0;
        padding: 10px 14px;
      }

      #input {
        padding: 10px 14px;
      }
    }

    /* iOS-style animations */
    .message {
      animation: fadeIn 0.2s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
  </style>
</head>
<body>
  <div id="chat"></div>
  <form id="input-form">
    <input id="input" autocomplete="off" placeholder="Type a message..." />
    <button type="submit" id="send">Send</button>
  </form>
  <script>
    const chat = document.getElementById('chat');
    const form = document.getElementById('input-form');
    const input = document.getElementById('input');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      addMessage('user', message);
      input.value = '';
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        addMessage('bot', data);
      } catch (err) {
        addMessage('bot', 'Error: Unable to reach server.');
      }
    });

    function addMessage(role, content) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `message ${role}`;
      
      // If this is a bot message with think content
      if (role === 'bot' && content.think && content.think.length > 0) {
        // Create think container first
        const thinkContainer = document.createElement('div');
        thinkContainer.className = 'think-content';
        
        // Create header with toggle
        const header = document.createElement('div');
        header.className = 'think-header';
        
        // Create toggle icon
        const toggleIcon = document.createElement('div');
        toggleIcon.className = 'think-toggle-icon';
        toggleIcon.innerHTML = '▶';
        
        // Create toggle text
        const toggleText = document.createElement('span');
        toggleText.className = 'think-toggle-text';
        toggleText.textContent = 'Thinking process';
        
        // Add icon and text to header
        header.appendChild(toggleIcon);
        header.appendChild(toggleText);
        
        // Create body for think content
        const body = document.createElement('div');
        body.className = 'think-body';
        body.innerHTML = content.think.join('<br>');
        
        // Add event listener to header
        header.onclick = () => {
          body.classList.toggle('expanded');
          toggleIcon.classList.toggle('expanded');
        };
        
        // Add header and body to think container
        thinkContainer.appendChild(header);
        thinkContainer.appendChild(body);
        
        // Add main content
        messageDiv.innerHTML = content.main;
        
        // Add elements in reverse order (think content first)
        chat.appendChild(thinkContainer);
        chat.appendChild(messageDiv);
      } else {
        // Regular message
        messageDiv.textContent = content;
        chat.appendChild(messageDiv);
      }
      
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
